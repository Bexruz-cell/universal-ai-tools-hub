openapi: 3.1.0
info:
  title: OmniTools Universal AI Hub API
  description: Cross-platform Tool Hub compatible with OpenAI Codex, Google Antigravity,
    Anthropic Claude, and ChatGPT Actions.
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Local development server
paths:
  /:
    get:
      summary: Root Status
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health Check
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /tools/calc:
    post:
      summary: Evaluate Math Expression
      operationId: api_tool_calc_tools_calc_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalcRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tools/scrape:
    post:
      summary: Scrape Web Content with SSRF Protection
      operationId: api_tool_scrape_tools_scrape_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tools/youtube:
    post:
      summary: Extract YouTube Subtitles
      operationId: api_tool_youtube_tools_youtube_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YouTubeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tools/crypto:
    post:
      summary: Query Crypto Spot Prices
      operationId: api_tool_crypto_tools_crypto_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tools/search:
    post:
      summary: Deep Web & Catalog Search
      operationId: api_tool_search_tools_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tools/convert:
    post:
      summary: Convert Fiat Currencies
      operationId: api_tool_convert_tools_convert_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /catalog:
    get:
      summary: Get 2026 AI Tools Catalog
      operationId: get_catalog_catalog_get
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search keyword in repos
          title: Query
        description: Search keyword in repos
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /catalog/categories:
    get:
      summary: Get Catalog Categories
      operationId: get_catalog_categories_catalog_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/catalog:
    get:
      summary: Search 2026 AI Tools Catalog (Legacy)
      operationId: api_catalog_legacy_api_v1_catalog_get
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search keyword in repos
          title: Query
        description: Search keyword in repos
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/web/scrape:
    get:
      summary: Extract clean text from URL (Legacy)
      operationId: api_scrape_legacy_api_v1_web_scrape_get
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          description: Target webpage URL
          title: Url
        description: Target webpage URL
      - name: max_length
        in: query
        required: false
        schema:
          type: integer
          description: Max character length
          default: 8000
          title: Max Length
        description: Max character length
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/youtube/transcript:
    get:
      summary: Extract YouTube Subtitles (Legacy)
      operationId: api_youtube_legacy_api_v1_youtube_transcript_get
      parameters:
      - name: video
        in: query
        required: true
        schema:
          type: string
          description: YouTube URL or Video ID
          title: Video
        description: YouTube URL or Video ID
      - name: languages
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Languages comma-separated
          default: ru,en
          title: Languages
        description: Languages comma-separated
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/crypto/price:
    get:
      summary: Live Crypto Prices (Legacy)
      operationId: api_crypto_legacy_api_v1_crypto_price_get
      parameters:
      - name: coins
        in: query
        required: false
        schema:
          type: string
          description: Tickers comma-separated
          default: btc,eth,sol,ton
          title: Coins
        description: Tickers comma-separated
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/finance/convert:
    get:
      summary: Currency Converter (Legacy)
      operationId: api_convert_legacy_api_v1_finance_convert_get
      parameters:
      - name: amount
        in: query
        required: false
        schema:
          type: number
          minimum: 0.01
          default: 1.0
          title: Amount
      - name: from_curr
        in: query
        required: false
        schema:
          type: string
          default: USD
          title: From Curr
      - name: to_curr
        in: query
        required: false
        schema:
          type: string
          default: RUB
          title: To Curr
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CalcRequest:
      properties:
        expression:
          type: string
          title: Expression
          description: Mathematical expression to evaluate (e.g. 'sqrt(144) + 10')
        precision:
          anyOf:
          - type: integer
          - type: 'null'
          title: Precision
          description: Decimal places for rounding
          default: 4
      type: object
      required:
      - expression
      title: CalcRequest
    ConvertRequest:
      properties:
        amount:
          type: number
          minimum: 0.01
          title: Amount
          description: Amount to convert
          default: 1.0
        from_curr:
          type: string
          title: From Curr
          description: Source currency ISO code
          default: USD
        to_curr:
          type: string
          title: To Curr
          description: Target currency ISO code
          default: RUB
      type: object
      title: ConvertRequest
    CryptoRequest:
      properties:
        coins:
          anyOf:
          - items:
              type: string
            type: array
          - type: string
          - type: 'null'
          title: Coins
          description: Coin symbols or list
          default: btc,eth,sol,ton
        vs_currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Vs Currency
          description: Target comparison fiat currency
          default: usd
      type: object
      title: CryptoRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ScrapeRequest:
      properties:
        url:
          type: string
          title: Url
          description: Target webpage URL to read
        max_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Length
          description: Max characters to return
          default: 8000
      type: object
      required:
      - url
      title: ScrapeRequest
    SearchRequest:
      properties:
        query:
          type: string
          title: Query
          description: Search keyword or phrase
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
          description: Max results to return
          default: 5
        depth:
          anyOf:
          - type: integer
          - type: 'null'
          title: Depth
          description: Depth of research (1-3)
          default: 1
      type: object
      required:
      - query
      title: SearchRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    YouTubeRequest:
      properties:
        video:
          type: string
          title: Video
          description: YouTube video URL or 11-char ID
        languages:
          anyOf:
          - type: string
          - type: 'null'
          title: Languages
          description: Comma-separated language priority list
          default: ru,en
      type: object
      required:
      - video
      title: YouTubeRequest
